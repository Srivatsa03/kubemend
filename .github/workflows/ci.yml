name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor and the ceiling of the supported range. The middle versions
        # rarely break independently, and a matrix nobody waits for gets ignored.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # The git-backed tests need an identity to commit with.
      - run: |
          git config --global user.email ci@kubemend
          git config --global user.name ci
      - run: pytest -q

  demo:
    # The claim this project makes is that it works against a real cluster, so
    # CI runs the real demo rather than asserting that the mocks agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      # Installed directly rather than through a third-party action: the one
      # that looked obvious pins a k3d release that has since been withdrawn,
      # so it 404s on every run and nothing in this repo can fix that.
      - name: Install k3d
        run: curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Create a cluster
        run: |
          k3d version
          k3d cluster create kubemend-demo --agents 1 --wait
          kubectl get nodes
      - run: |
          git config --global user.email ci@kubemend
          git config --global user.name ci
      - name: Run the end-to-end demo
        env:
          KUBEMEND_BIN: kubemend
        run: bash demo/run.sh --keep
