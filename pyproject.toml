[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubemend"
version = "0.2.0"
description = "A Kubernetes SRE agent whose only write surface is a git commit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Srivatsa Kamballa" }]
keywords = ["kubernetes", "sre", "ai-agent", "gitops", "incident-response", "remediation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kubemend = "kubemend.cli:main"

[tool.setuptools.packages.find]
include = ["kubemend*"]
